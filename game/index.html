<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skylark - A Bush-Plane Run over Kepulauan Cahaya</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0a1c2e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; }
  canvas { display: block; width: 1280px; height: 720px; background: #2f7fc9; }
  #hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    color: rgba(255,255,255,0.65); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Arrows / WASD steer &amp; climb &middot; Shift throttle up &middot; Ctrl throttle down &middot; Mouse drag steers &middot; M mute &middot; R restart</div>
</div>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/terrain.js"></script>
<script src="src/plane.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/input.js"></script>
<script src="src/missions.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
